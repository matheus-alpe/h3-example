<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>H3 Atlas</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23ffb547' d='M12 1l9.5 5.5v11L12 23l-9.5-5.5v-11z'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="map" aria-label="Map"></div>
    <nav id="rail" aria-label="Examples"></nav>
    <aside id="panel">
      <header class="brand">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1l9.5 5.5v11L12 23l-9.5-5.5v-11z" /><path d="M12 7l4.3 2.5v5L12 17l-4.3-2.5v-5z" /></svg>
        <div>
          <h1>H3 Atlas</h1>
          <p>A field guide to Uber's hexagonal index</p>
        </div>
        <button id="globe" class="chip" aria-pressed="false" title="Toggle globe projection">Globe</button>
      </header>
      <section id="mode-head"></section>
      <section id="mode-body"></section>
      <section id="mode-apis"></section>
    </aside>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
